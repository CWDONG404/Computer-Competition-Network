name: 检查与部署

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run catalog:validate
      - run: npm run score:test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_PORT: ${{ secrets.ECS_PORT }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查部署凭据
        id: gate
        shell: bash
        run: |
          if [[ -n "$ECS_HOST" && -n "$ECS_USER" && -n "$ECS_SSH_PRIVATE_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 ECS 部署 Secrets，本次只完成质量检查。"
          fi
      - name: 准备 SSH
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > ~/.ssh/ccn_deploy
          chmod 600 ~/.ssh/ccn_deploy
          ssh-keyscan -p "${ECS_PORT:-22}" -H "$ECS_HOST" >> ~/.ssh/known_hosts
      - name: 打包源码
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: tar --exclude=.git --exclude=node_modules --exclude=.next --exclude='.env*' -czf /tmp/ccn-release.tgz .
      - name: 上传并发布
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          scp -P "${ECS_PORT:-22}" -i ~/.ssh/ccn_deploy /tmp/ccn-release.tgz "$ECS_USER@$ECS_HOST:/tmp/ccn-release.tgz"
          ssh -p "${ECS_PORT:-22}" -i ~/.ssh/ccn_deploy "$ECS_USER@$ECS_HOST" \
            "install -d /opt/computer-competition-network/app && tar -xzf /tmp/ccn-release.tgz -C /opt/computer-competition-network/app && cd /opt/computer-competition-network/app && docker compose --env-file /opt/computer-competition-network/.env.production up -d --build --remove-orphans && rm -f /tmp/ccn-release.tgz"
